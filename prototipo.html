<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HELLCIFE · protótipo de personagem</title>
<style>
  html, body { margin: 0; height: 100%; background: #9cc3dd; overflow: hidden; font-family: Inter, system-ui, sans-serif; }
  canvas { display: block; }
  #ui { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: calc(100% - 32px); }
  #ui button { border: 0; border-radius: 999px; padding: 9px 15px; font: 700 14px Inter, system-ui, sans-serif; background: #2b1d3a; color: #fff; cursor: pointer; }
  #ui button.on { background: linear-gradient(100deg, #8338ec, #e8343f); }
  .rotulo { position: fixed; top: 16px; padding: 6px 12px; border-radius: 10px; background: rgba(20, 16, 30, .72); color: #fff; font: 700 14px Inter, system-ui, sans-serif; }
  #r1 { left: 16px; } #r2 { right: 16px; }
  #info { position: fixed; top: 52px; right: 16px; color: #1d1d1f; font: 12px Inter, system-ui, sans-serif; background: rgba(255,255,255,.75); padding: 6px 10px; border-radius: 8px; max-width: 46vw; }
</style>
</head>
<body>
<div class="rotulo" id="r1">Hoje (boneco de caixas)</div>
<div class="rotulo" id="r2">Protótipo (corpo com esqueleto)</div>
<div id="info"></div>
<div id="ui"></div>
<script type="module" src="/src/prototipo.js"></script>
</body>
</html>
